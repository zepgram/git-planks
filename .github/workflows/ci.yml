name: CI

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "assets/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "assets/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable && rustup default stable
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - run: cargo check --locked
