[package]
name = "git-planks"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Who owns the code that is still alive? Deterministic surviving-lines analysis of a whole stack across GitHub, GitLab, Bitbucket and any git remote."
license = "MIT"
repository = "https://github.com/zepgram/git-planks"
readme = "README.md"
keywords = ["git", "blame", "code-ownership", "analytics", "cli"]
categories = ["command-line-utilities", "development-tools", "visualization"]
exclude = ["docs/*", ".github/*"]

[[bin]]
name = "git-planks"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
unicode-normalization = "0.1"
ureq = "3"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
